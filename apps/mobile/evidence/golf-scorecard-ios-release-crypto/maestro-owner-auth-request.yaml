appId: app.crew.next
---
- assertVisible:
    id: private-access-signed-out
- tapOn:
    id: private-access-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-view
    timeout: 15000
- tapOn:
    id: sign-in-email
- inputText: crew.local@example.test
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible: ANFRAGE ANGENOMMEN
    timeout: 20000
