appId: app.crew.next
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: events-view
    timeout: 20000
- tapOn:
    id: event-evt_local_team_day_2026
- extendedWaitUntil:
    visible:
      id: event-hub
    timeout: 20000
- tapOn:
    id: event-hub-sync-button
- extendedWaitUntil:
    visible: .*synchronisiert.*
    timeout: 20000
- tapOn:
    id: event-hub-tab-feed
- extendedWaitUntil:
    visible:
      id: team-feed-view
    timeout: 20000
- scrollUntilVisible:
    element: 'iOS participant reconnect check: orientation B is ready.'
    direction: DOWN
- assertVisible: 'iOS participant reconnect check: orientation B is ready.'
- assertVisible:
    id: team-feed-entry-converged
