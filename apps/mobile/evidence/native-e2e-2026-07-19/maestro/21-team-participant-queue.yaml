appId: app.crew.next
---
- assertVisible:
    id: team-feed-view
- tapOn:
    id: team-feed-input
- inputText: 'Participant reconnect check: option B is ready.'
- hideKeyboard
- tapOn:
    id: team-feed-submit
- scrollUntilVisible:
    element:
      id: team-feed-entry-queued
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: team-feed-entry-queued
    timeout: 15000
- assertVisible: LOKAL GESPEICHERT
- assertVisible: 'Participant reconnect check: option B is ready.'
