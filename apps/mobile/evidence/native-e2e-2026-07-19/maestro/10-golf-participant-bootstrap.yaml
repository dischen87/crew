appId: app.crew.next
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: events-view
    timeout: 20000
- tapOn:
    id: event-evt_local_turkey_golf_2026
- extendedWaitUntil:
    visible:
      id: event-hub
    timeout: 20000
- assertVisible: Turkey Golf Tour 2026
- tapOn:
    id: event-hub-date-2026-10-05
- scrollUntilVisible:
    element: "Golf round: Carya Golf Club"
    direction: DOWN
- tapOn: "Golf round: Carya Golf Club"
- extendedWaitUntil:
    visible:
      id: golf-scorecard-view
    timeout: 20000
- assertVisible: Scorekarte
- assertVisible: "Carya Golf Club"
- assertVisible: Alle Score-Daten synchronisiert
