appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: private-access-sign-in
    direction: DOWN
    timeout: 30000
- tapOn:
    id: private-access-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-view
    timeout: 15000
- scrollUntilVisible:
    element:
      id: sign-in-email
    direction: DOWN
    timeout: 30000
- tapOn:
    id: sign-in-email
- inputText: ${ROLE_EMAIL}
- pressKey: ENTER
- extendedWaitUntil:
    visible: ANFRAGE ANGENOMMEN
    timeout: 30000
- assertVisible: Wenn die Adresse verwendet werden kann, senden wir einen Anmeldelink.
