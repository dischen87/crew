- assertVisible:
    id: event-hub-sync-button
- runFlow:
    when:
      visible: Open debugger.*
    commands:
      - tapOn:
          point: 92%,92%
- extendedWaitUntil:
    notVisible: Open debugger.*
    timeout: 30000
- extendedWaitUntil:
    notVisible: Refreshing...
    timeout: 30000
- takeScreenshot: apps/mobile/evidence/native-e2e-2026-07-22/publish-remaining-final/runtime/raw/51-event-hub-large-top-final-1170x2532
