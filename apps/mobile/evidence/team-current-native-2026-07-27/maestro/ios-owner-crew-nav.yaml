appId: app.crew.next
---
- stopApp
- openLink: crewnext://events/evt_local_team_day_2026
- runFlow:
    when:
      visible: Öffnen
    commands:
      - tapOn: Öffnen
- extendedWaitUntil:
    visible:
      id: event-hub
    timeout: 30000
- assertVisible:
    id: event-hub-tab-crew
- tapOn:
    id: event-hub-tab-crew
- extendedWaitUntil:
    visible:
      id: team-assignments-view
    timeout: 30000
- assertVisible: Teams einteilen
- takeScreenshot: ${CAPTURE_DIR}/01-owner-team-setup-from-crew-tab
- openLink: crewnext://events/evt_local_team_day_2026/decisions/tdc_local_team_day_lunch
- runFlow:
    when:
      visible: Öffnen
    commands:
      - tapOn: Öffnen
- extendedWaitUntil:
    visible:
      id: team-decision-view
    timeout: 30000
- assertVisible: Entscheidung
- scrollUntilVisible:
    element:
      text: Was essen wir zum Abschluss?
    direction: DOWN
    timeout: 30000
- assertVisible: Was essen wir zum Abschluss?
- takeScreenshot: ${CAPTURE_DIR}/02-owner-team-decision-options
