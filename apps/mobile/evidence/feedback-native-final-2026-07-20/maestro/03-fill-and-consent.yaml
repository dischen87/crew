appId: app.crew.next.feedbackfinal
---
- scrollUntilVisible:
    element:
      id: feedback-compose-title
    direction: UP
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: feedback-compose-title
- inputText: 'Native Screenshot Erfolg'
- assertVisible:
    id: feedback-compose-title
    text: Native Screenshot Erfolg
    enabled: true
- scrollUntilVisible:
    element:
      id: feedback-compose-body
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: feedback-compose-body
    enabled: true
    point: 20%,20%
- inputText: 'Echter iOS Capture Preview Upload Commit Nachweis.'
- assertVisible:
    id: feedback-compose-body
    text: Echter iOS Capture Preview Upload Commit Nachweis.
    enabled: true
- scrollUntilVisible:
    element:
      id: feedback-screenshot-consent
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: feedback-screenshot-consent
- assertVisible:
    id: feedback-screenshot-consent
    checked: true
    enabled: true
- scrollUntilVisible:
    element:
      id: feedback-compose-submit
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
    centerElement: true
- assertVisible: Feedback mit Screenshot senden
- assertVisible:
    id: feedback-compose-submit
    enabled: true
