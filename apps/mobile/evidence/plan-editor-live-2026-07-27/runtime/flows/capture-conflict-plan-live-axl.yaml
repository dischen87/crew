appId: ${APP_ID}
---
- openLink: crewnext://events/evt_local_turkey_golf_2026
- runFlow:
    when:
      visible: Öffnen
    commands:
      - tapOn: Öffnen
- extendedWaitUntil:
    visible:
      id: event-hub
    timeout: 30000
- tapOn:
    id: event-hub-tab-plan
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: event-hub
    commands:
      - tapOn:
          id: event-hub-tab-plan
- extendedWaitUntil:
    visible:
      id: plan-view
    timeout: 30000
- assertVisible: Änderungen prüfen
- takeScreenshot: ${CAPTURE_DIR}/conflict-plan-axl-top
- scrollUntilVisible:
    element: ${EXPECTED_PLAN_TEXT}
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible: ${EXPECTED_PLAN_TEXT}
- takeScreenshot: ${CAPTURE_DIR}/conflict-plan-axl-issue
- openLink: crewnext://events/evt_local_turkey_golf_2026/items/iti_local_turkey_golf_round_gloria
- runFlow:
    when:
      visible: Öffnen
    commands:
      - tapOn: Öffnen
- extendedWaitUntil:
    visible:
      id: live-item-view
    timeout: 30000
- assertVisible: ${SERVER_TITLE}
- takeScreenshot: ${CAPTURE_DIR}/conflict-live-axl-top
- scrollUntilVisible:
    element: ${EXPECTED_LIVE_TEXT}
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible: ${EXPECTED_LIVE_TEXT}
- takeScreenshot: ${CAPTURE_DIR}/conflict-live-axl-status
