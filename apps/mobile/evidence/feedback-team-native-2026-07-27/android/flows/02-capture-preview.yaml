appId: ${APP_ID}
---
- tapOn:
    id: community-feedback-compose-screenshot
- extendedWaitUntil:
    visible:
      id: feedback-compose-view
    timeout: 30000
- scrollUntilVisible:
    element:
      id: feedback-screenshot-preview
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
    centerElement: true
- assertVisible:
    id: feedback-screenshot-preview
- assertVisible:
    id: feedback-screenshot-consent
    checked: false
    enabled: true
- takeScreenshot: apps/mobile/evidence/feedback-team-native-2026-07-27/android/screenshots/02-native-preview-consent-off-1080x2400
