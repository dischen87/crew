    centerElement: true
- tapOn:
    id: feedback-compose-title
- inputText: Android Team Feedback Final 0727
- assertVisible:
    id: feedback-compose-title
    text: Android Team Feedback Final 0727
    enabled: true
- scrollUntilVisible:
    element:
      id: feedback-compose-body
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
