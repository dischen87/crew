appId: app.crew.next
---
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      id: android-evidence-${SURFACE}-${STATE}
    direction: DOWN
    timeout: 30000
- tapOn:
    id: android-evidence-${SURFACE}-${STATE}
- scrollUntilVisible:
    element:
      id: ${TARGET}
    direction: DOWN
    timeout: 30000
