appId: ${APP_ID}
---
- tapOn:
    id: private-access-sign-in
- extendedWaitUntil:
    visible:
      id: sign-in-view
    timeout: 15000
- tapOn:
    id: sign-in-email
- inputText: ${ROLE_EMAIL}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible: ANFRAGE ANGENOMMEN
    timeout: 30000
- assertVisible: Wenn die Adresse verwendet werden kann, senden wir einen Anmeldelink.
